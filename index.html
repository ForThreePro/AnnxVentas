<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caligrafícos by @annx.llvl</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@300;500;600&display=swap');
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body { 
      background: linear-gradient(135deg, #FDF2FF 0%, #F3E8FF 50%, #E9D5FF 100%);
      font-family: 'Poppins', sans-serif;
      color: #581C87;
      min-height: 100vh;
      padding: 0;
    }
    
    .container {
      max-width: 500px;
      margin: 0 auto;
      padding: 30px 20px;
    }
    
    .header {
      text-align: center;
      margin-bottom: 30px;
    }
    
    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 9vw;
      background: linear-gradient(90deg, #C084FC, #A855F7, #9333EA);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 5px;
    }
    
    .user { font-size: 4vw; color: #A855F7; font-weight: 500; }
    
    .card {
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(192, 132, 252, 0.3);
      border-radius: 25px;
      padding: 25px;
      margin: 20px 0;
      box-shadow: 0 8px 32px rgba(168, 85, 247, 0.15);
    }
    
    .card-title {
      font-size: 5vw;
      font-weight: 600;
      color: #7E22CE;
      margin-bottom: 15px;
      text-align: center;
    }
    
    .item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px dashed #D8B4FE;
      font-size: 4vw;
    }
    
    .item:last-child { border: none; }
    
    .price { color: #9333EA; font-weight: 600; }
    
    .btn {
      padding: 15px;
      border-radius: 15px;
      text-decoration: none;
      font-weight: 600;
      font-size: 4.5vw;
      text-align: center;
      display: block;
      margin-top: 15px;
      transition: 0.3s;
    }
    
    .btn-yape {
      background: linear-gradient(90deg, #A855F7, #9333EA);
      color: white;
      box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4);
    }
    
    .btn-wa {
      background: white;
      color: #9333EA;
      border: 2px solid #C084FC;
    }
    
    .btn:hover { transform: translateY(-2px); }
    
    .pagos {
      text-align: center;
      font-size: 3.8vw;
      line-height: 1.8;
    }
    
    @media (min-width: 600px) {
      .logo { font-size: 40px; }
      .user, .item, .btn, .pagos { font-size: 16px; }
      .card-title { font-size: 20px; }
    }
  </style>
</head>
<body>

  <div class="container">
    
    <div class="header">
      <h1 class="logo">𝙲𝚊𝚕𝚒𝚐𝚛𝚊𝚏𝚒́𝚌𝚘𝚜</h1>
      <p class="user">@annx.llvl 𓆩♡𓆪</p>
    </div>

    <div class="card">
      <h2 class="card-title">𖹭.ᐟ 𝚃𝚎𝚖𝚊́𝚝𝚒𝚌𝚘𝚜</h2>
      <div class="item">
        <span>Curvos</span>
        <span class="price">S/5 / 200 💎</span>
      </div>
      <div class="item">
        <span>Objeto</span>
        <span class="price">S/5 / 200 💎</span>
      </div>
      <a class="btn btn-yape" href="https://www.yape.com.pe/qr/932712628?amount=5.00&concept=Caligrafia%20Tematica">💜 Pagar S/5 con Yape</a>
    </div>

    <div class="card">
      <h2 class="card-title">𖹭.ᐟ 𝚂𝚒𝚖𝚙𝚕𝚎</h2>
      <div class="item">
        <span>c/u</span>
        <span class="price">S/3 / 100 💎</span>
      </div>
      <a class="btn btn-yape" href="https://www.yape.com.pe/qr/932712628?amount=3.00&concept=Caligrafia%20Simple">💜 Pagar S/3 con Yape</a>
    </div>

    <a class="btn btn-wa" href="https://wa.me/message/2BUTTKQYZXH4K1">📲 Pedir por WhatsApp</a>

    <div class="card pagos">
      <h3 style="color:#7E22CE; margin-bottom:10px;">Métodos De Pago</h3>
      <p><b>Yape 💜</b><br>
      932 712 628<br>
      Eliseo B.<br><br>
      <b>Diamantes 💎</b><br>
      id : 1434157249<br>
      Name : Baby Ann</p>
    </div>

  </div>

</body>
</html>
