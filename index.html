<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ann by Lettering</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;500;600&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body { 
      background: #FFF8FC;
      background-image: radial-gradient(#FAD4E6 1px, transparent 1px);
      background-size: 30px 30px;
      font-family: 'Montserrat', sans-serif;
      color: #8A4A6B;
      min-height: 100vh;
    }

    /* FLORES CAYENDO */
    .petal {
      position: fixed;
      top: -20px;
      font-size: 20px;
      animation: fallPetals linear infinite;
      z-index: 0;
    }

    @keyframes fallPetals {
      to { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }

    .main {
      max-width: 480px;
      margin: 0 auto;
      padding: 35px 20px;
      position: relative;
      z-index: 1;
    }

    .head { text-align: center; margin-bottom: 30px; }

    .title {
      font-family: 'Great Vibes', cursive;
      font-size: 12vw;
      color: #E86BA4;
      text-shadow: 0 2px 10px rgba(232, 107, 164, 0.2);
    }

    .subtitle { font-size: 4vw; color: #C77A9E; letter-spacing: 1px; }

    .frame {
      background: white;
      border-radius: 30px;
      padding: 24px;
      margin: 20px 0;
      border: 2px solid #FAD4E6;
      box-shadow: 0 5px 25px rgba(232, 107, 164, 0.15);
      position: relative;
    }

    .frame::before {
      content: '❀';
      position: absolute;
      top: -15px;
      left: 20px;
      background: white;
      padding: 0 10px;
      font-size: 24px;
      color: #E86BA4;
    }

    .section-name {
      font-family: 'Great Vibes', cursive;
      font-size: 6vw;
      color: #E86BA4;
      text-align: center;
      margin-bottom: 16px;
    }

    .line {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      font-size: 4vw;
      border-bottom: 1px dotted #FAD4E6;
    }

    .line:last-child { border: none; }
    .amount { color: #D946A0; font-weight: 600; }

    .button {
      padding: 14px;
      border-radius: 50px;
      text-decoration: none;
      font-weight: 600;
      font-size: 4.2vw;
      text-align: center;
      display: block;
      margin-top: 16px;
      border: none;
      cursor: pointer;
      width: 100%;
      transition: 0.3s;
    }

    .button-pink {
      background: linear-gradient(90deg, #F472B6, #EC4899);
      color: white;
      box-shadow: 0 4px 15px rgba(236, 72, 153, 0.3);
    }

    .button-pink:hover { transform: translateY(-2px); }

    .button-white {
      background: white;
      color: #EC4899;
      border: 2px solid #F472B6;
    }

    /* MODAL SUAVE */
    .overlay {
      display: none;
      position: fixed;
      z-index: 999;
      left: 0; top: 0;
      width: 100%; height: 100%;
      background: rgba(138, 74, 107, 0.3);
      backdrop-filter: blur(4px);
      justify-content: center;
      align-items: center;
    }

    .box-pay {
      background: #FFF8FC;
      border: 2px solid #FAD4E6;
      border-radius: 25px;
      padding: 25px;
      width: 90%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(232, 107, 164, 0.3);
    }

    .box-pay h3 { color: #E86BA4; font-family: 'Great Vibes'; font-size: 7vw; margin-bottom: 12px; }
    .pay-number {
      background: #FAD4E6;
      padding: 12px;
      border-radius: 15px;
      font-weight: 600;
      margin: 10px 0;
      font-size: 4.5vw;
      color: #8A4A6B;
    }

    .btn-copy { background: #F472B6; color: white; margin-bottom: 10px; }
    .btn-yape { background: linear-gradient(90deg, #EC4899, #D946A0); color: white; }
    .close-txt { margin-top: 12px; color: #C77A9E; cursor: pointer; text-decoration: underline; }

    @media (min-width: 600px) {
      .title { font-size: 50px; }
      .subtitle, .line, .button, .pay-number { font-size: 16px; }
      .section-name { font-size: 28px; }
      .box-pay h3 { font-size: 32px; }
    }
  </style>
</head>
<body>

  <!-- PETALOS -->
  <script>
    const flowers = ['🌸','🌷','🌺','💮'];
    for(let i = 0; i < 25; i++) {
      let petal = document.createElement('div');
      petal.className = 'petal';
      petal.innerText = flowers[Math.floor(Math.random() * flowers.length)];
      petal.style.left = Math.random() * 100 + 'vw';
      petal.style.animationDuration = (Math.random() * 6 + 5) + 's';
      petal.style.animationDelay = Math.random() * 8 + 's';
      document.body.appendChild(petal);
    }
  </script>

  <div class="main">

    <div class="head">
      <h1 class="title">Ann</h1>
      <p class="subtitle">@annx.llvl 𓆩♡𓆪</p>
    </div>

    <div class="frame">
      <h2 class="section-name">Caligrafías Temáticas</h2>
      <div class="line"><span>Curvos</span><span class="amount">S/5 / 200 💎</span></div>
      <div class="line"><span>Objeto</span><span class="amount">S/5 / 200 💎</span></div>
      <button class="button button-pink" onclick="showPay('5.00', 'Caligrafia Tematica')">💖 Comprar</button>
    </div>

    <div class="frame">
      <h2 class="section-name">Caligrafía Simple</h2>
      <div class="line"><span>c/u</span><span class="amount">S/3 / 100 💎</span></div>
      <button class="button button-pink" onclick="showPay('3.00', 'Caligrafia Simple')">💖 Comprar</button>
    </div>

    <a class="button button-white" href="https://wa.me/message/2BUTTKQYZXH4K1">💌 Escríbeme por WhatsApp</a>

  </div>

  <!-- MODAL PAGO -->
  <div id="payOverlay" class="overlay">
    <div class="box-pay">
      <h3>Métodos de Pago</h3>
      <p><b>Yape</b></p>
      <div class="pay-number" id="yapeNumber">932 712 628</div>
      <p style="font-size:3.5vw;">A nombre de: Eliseo B.</p>
      
      <button class="button btn-copy" onclick="copyYape()">📋 Copiar Número</button>
      <a class="button btn-yape" id="yapeBtn" href="#">💜 Pagar con Yape</a>
      
      <p style="margin-top:15px;"><b>Diamantes 💎</b><br>
      ID: 1434157249<br>
      Nick: Baby Ann</p>
      
      <p class="close-txt" onclick="hidePay()">Cerrar</p>
    </div>
  </div>

<script>
  function showPay(price, product) {
    document.getElementById('payOverlay').style.display = 'flex';
    document.getElementById('yapeBtn').href = `https://www.yape.com.pe/qr/932712628?amount=${price}&concept=${product}`;
  }
  
  function hidePay() {
    document.getElementById('payOverlay').style.display = 'none';
  }
  
  function copyYape() {
    navigator.clipboard.writeText('932712628');
    alert('Número copiado: 932 712 628 💖');
  }
  
  window.onclick = function(e) {
    if (e.target == document.getElementById('payOverlay')) hidePay();
  }
</script>

</body>
</html>
