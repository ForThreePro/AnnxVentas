<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Annx Lettering Store</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Inter:wght@400;500;700&display=swap');

    :root {
      --bg1: #0A0A1A;
      --bg2: #1A0B2E;
      --accent: #00F5FF;
      --accent2: #FF00E5;
      --text: #E0E0FF;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body { 
      background: radial-gradient(circle at 50% 50%, var(--bg2), var(--bg1));
      font-family: 'Inter', sans-serif;
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* PARTICULAS NEON */
    .particle {
      position: fixed;
      width: 3px;
      height: 3px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent);
      animation: float 8s infinite linear;
      z-index: 0;
    }

    @keyframes float {
      from { transform: translateY(100vh) scale(0); opacity: 0; }
      to { transform: translateY(-10vh) scale(1); opacity: 1; }
    }

    .wrap {
      max-width: 520px;
      margin: 0 auto;
      padding: 40px 18px;
      position: relative;
      z-index: 1;
    }

    .top { text-align: center; margin-bottom: 35px; }

    .brand {
      font-family: 'Orbitron', sans-serif;
      font-size: 10vw;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 15px var(--accent));
      letter-spacing: 2px;
    }

    .handle { font-size: 4vw; color: var(--accent); opacity: 0.8; }

    .box {
      background: rgba(10, 10, 26, 0.7);
      border: 1px solid rgba(0, 245, 255, 0.3);
      border-radius: 20px;
      padding: 22px;
      margin: 18px 0;
      backdrop-filter: blur(20px);
      box-shadow: 0 0 25px rgba(0, 245, 255, 0.1);
    }

    .box h2 {
      font-family: 'Orbitron', sans-serif;
      font-size: 5vw;
      color: var(--accent);
      text-align: center;
      margin-bottom: 14px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255, 0, 229, 0.2);
      font-size: 4vw;
    }

    .row:last-child { border: none; }
    .cost { color: var(--accent2); font-weight: 700; }

    .cta {
      padding: 14px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 700;
      font-size: 4.2vw;
      text-align: center;
      display: block;
      margin-top: 14px;
      border: none;
      cursor: pointer;
      width: 100%;
      transition: 0.2s;
      font-family: 'Orbitron', sans-serif;
    }

    .cta-buy {
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      color: #0A0A1A;
      box-shadow: 0 0 20px rgba(0, 245, 255, 0.5);
    }

    .cta-buy:hover { transform: scale(1.03); }

    .cta-wa {
      background: transparent;
      color: var(--accent);
      border: 2px solid var(--accent);
    }

    /* POPUP */
    .popup {
      display: none;
      position: fixed;
      z-index: 999;
      left: 0; top: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      justify-content: center;
      align-items: center;
    }

    .popup-box {
      background: #0A0A1A;
      border: 2px solid var(--accent);
      border-radius: 20px;
      padding: 24px;
      width: 90%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 0 40px var(--accent2);
    }

    .popup-box h3 { color: var(--accent); margin-bottom: 12px; font-family: 'Orbitron'; }
    .num-box {
      background: #1A0B2E;
      padding: 10px;
      border-radius: 10px;
      font-weight: 700;
      margin: 10px 0;
      font-size: 4.5vw;
      color: var(--accent2);
    }

    .btn-copy { background: var(--accent2); color: #0A0A1A; margin-bottom: 10px; }
    .btn-yape { background: var(--accent); color: #0A0A1A; }
    .close { margin-top: 12px; color: var(--accent); cursor: pointer; text-decoration: underline; }

    @media (min-width: 600px) {
      .brand { font-size: 42px; }
      .handle, .row, .cta, .num-box { font-size: 16px; }
      .box h2 { font-size: 20px; }
    }
  </style>
</head>
<body>

  <!-- PARTICULAS -->
  <script>
    for(let i = 0; i < 40; i++) {
      let p = document.createElement('div');
      p.className = 'particle';
      p.style.left = Math.random() * 100 + 'vw';
      p.style.animationDuration = (Math.random() * 5 + 4) + 's';
      p.style.animationDelay = Math.random() * 8 + 's';
      document.body.appendChild(p);
    }
  </script>

  <div class="wrap">

    <div class="top">
      <h1 class="brand">ANNX LETTERING</h1>
      <p class="handle">@annx.llvl ⚡</p>
    </div>

    <div class="box">
      <h2>PACK TEMÁTICOS</h2>
      <div class="row"><span>Curvos</span><span class="cost">S/5 / 200 💎</span></div>
      <div class="row"><span>Objeto</span><span class="cost">S/5 / 200 💎</span></div>
      <button class="cta cta-buy" onclick="openPay('5.00', 'Pack Tematico')">⚡ COMPRAR AHORA</button>
    </div>

    <div class="box">
      <h2>PACK SIMPLE</h2>
      <div class="row"><span>c/u</span><span class="cost">S/3 / 100 💎</span></div>
      <button class="cta cta-buy" onclick="openPay('3.00', 'Pack Simple')">⚡ COMPRAR AHORA</button>
    </div>

    <a class="cta cta-wa" href="https://wa.me/message/2BUTTKQYZXH4K1">💬 CONTACTO DIRECTO</a>

  </div>

  <!-- POPUP PAGO -->
  <div id="payPopup" class="popup">
    <div class="popup-box">
      <h3>MÉTODOS DE PAGO</h3>
      <p><b>YAPE</b></p>
      <div class="num-box" id="yapeNum">932 712 628</div>
      <p style="font-size:3.5vw; opacity:0.8;">Titular: Eliseo B.</p>
      
      <button class="cta btn-copy" onclick="copyNum()">📋 COPIAR NÚMERO</button>
      <a class="cta btn-yape" id="yapeLink" href="#">💜 PAGAR CON YAPE</a>
      
      <p style="margin-top:15px;"><b>DIAMANTES</b><br>
      ID: 1434157249<br>
      Nick: Baby Ann</p>
      
      <p class="close" onclick="closePay()">Cerrar</p>
    </div>
  </div>

<script>
  function openPay(amount, item) {
    document.getElementById('payPopup').style.display = 'flex';
    document.getElementById('yapeLink').href = `https://www.yape.com.pe/qr/932712628?amount=${amount}&concept=${item}`;
  }
  
  function closePay() {
    document.getElementById('payPopup').style.display = 'none';
  }
  
  function copyNum() {
    navigator.clipboard.writeText('932712628');
    alert('Número copiado: 932 712 628 ⚡');
  }
  
  window.onclick = function(e) {
    if (e.target == document.getElementById('payPopup')) closePay();
  }
</script>

</body>
</html>
