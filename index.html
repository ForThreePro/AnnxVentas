<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caligrafícos by @annx.llvl</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@300;500;600&display=swap');
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body { 
      background: linear-gradient(135deg, #FDF2FF 0%, #F3E8FF 50%, #E9D5FF 100%);
      font-family: 'Poppins', sans-serif;
      color: #581C87;
      min-height: 100vh;
      padding: 0;
      overflow-x: hidden;
      position: relative;
    }
    
    /* BRILLOS CAYENDO */
    .sparkle {
      position: fixed;
      top: -10px;
      width: 6px;
      height: 6px;
      background: white;
      border-radius: 50%;
      box-shadow: 0 0 10px #fff, 0 0 20px #E9D5FF;
      animation: fall linear infinite;
      z-index: 0;
    }
    
    @keyframes fall {
      to { transform: translateY(100vh) rotate(360deg); opacity: 0; }
    }
    
    .container {
      max-width: 500px;
      margin: 0 auto;
      padding: 30px 20px;
      position: relative;
      z-index: 1;
    }
    
    .header { text-align: center; margin-bottom: 30px; }
    
    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 9vw;
      background: linear-gradient(90deg, #C084FC, #A855F7, #9333EA);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(168,85,247,0.4);
      animation: glow 2s ease-in-out infinite alternate;
    }
    
    @keyframes glow {
      from { text-shadow: 0 0 10px rgba(168,85,247,0.4); }
      to { text-shadow: 0 0 25px rgba(192,132,252,0.8); }
    }
    
    .user { font-size: 4vw; color: #A855F7; font-weight: 500; }
    
    .card {
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(192, 132, 252, 0.4);
      border-radius: 25px;
      padding: 25px;
      margin: 20px 0;
      box-shadow: 0 8px 32px rgba(168, 85, 247, 0.2);
      position: relative;
      overflow: hidden;
    }
    
    .card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(45deg, transparent, rgba(255,255,255,0.3), transparent);
      animation: shine 3s infinite;
    }
    
    @keyframes shine {
      0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
      100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
    }
    
    .card-title {
      font-size: 5vw;
      font-weight: 600;
      color: #7E22CE;
      margin-bottom: 15px;
      text-align: center;
      position: relative;
    }
    
    .item {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px dashed #D8B4FE;
      font-size: 4vw;
      position: relative;
    }
    
    .price { color: #9333EA; font-weight: 600; }
    
    .btn {
      padding: 15px;
      border-radius: 15px;
      text-decoration: none;
      font-weight: 600;
      font-size: 4.5vw;
      text-align: center;
      display: block;
      margin-top: 15px;
      border: none;
      cursor: pointer;
      width: 100%;
      position: relative;
      z-index: 2;
      transition: 0.3s;
    }
    
    .btn-comprar {
      background: linear-gradient(90deg, #A855F7, #9333EA);
      color: white;
      box-shadow: 0 4px 20px rgba(168, 85, 247, 0.5);
    }
    
    .btn-comprar:hover { box-shadow: 0 6px 30px rgba(168, 85, 247, 0.7); }
    
    .btn-wa {
      background: white;
      color: #9333EA;
      border: 2px solid #C084FC;
    }

    /* VENTANA FLOTANTE */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0; top: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(8px);
      justify-content: center;
      align-items: center;
    }
    
    .modal-content {
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(192,132,252,0.5);
      border-radius: 25px;
      padding: 25px;
      width: 90%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 0 40px rgba(168,85,247,0.4);
    }
    
    .modal-content h3 { color: #7E22CE; margin-bottom: 15px; }
    .modal-numero {
      background: #F3E8FF;
      padding: 12px;
      border-radius: 12px;
      font-weight: 600;
      margin: 10px 0;
      font-size: 4.5vw;
      box-shadow: inset 0 0 10px rgba(168,85,247,0.2);
    }
    
    .btn-copiar { background: #C084FC; color: white; margin-bottom: 10px; }
    .btn-yape-modal { background: linear-gradient(90deg, #A855F7, #9333EA); color: white; }
    .cerrar { margin-top: 15px; color: #9333EA; text-decoration: underline; cursor: pointer; font-size: 3.8vw; }
    
    @media (min-width: 600px) {
      .logo { font-size: 40px; }
      .user, .item, .btn, .modal-numero { font-size: 16px; }
    }
  </style>
</head>
<body>

  <!-- BRILLOS -->
  <script>
    for(let i = 0; i < 30; i++) {
      let sparkle = document.createElement('div');
      sparkle.className = 'sparkle';
      sparkle.style.left = Math.random() * 100 + 'vw';
      sparkle.style.animationDuration = (Math.random() * 3 + 2) + 's';
      sparkle.style.animationDelay = Math.random() * 5 + 's';
      document.body.appendChild(sparkle);
    }
  </script>

  <div class="container">
    
    <div class="header">
      <h1 class="logo">𝙲𝚊𝚕𝚒𝚐𝚛𝚊𝚏𝚒́𝚌𝚘𝚜</h1>
      <p class="user">@annx.llvl 𓆩♡𓆪</p>
    </div>

    <div class="card">
      <h2 class="card-title">𖹭.ᐟ 𝚃𝚎𝚖𝚊́𝚝𝚒𝚌𝚘𝚜</h2>
      <div class="item"><span>Curvos</span><span class="price">S/5 / 200 💎</span></div>
      <div class="item"><span>Objeto</span><span class="price">S/5 / 200 💎</span></div>
      <button class="btn btn-comprar" onclick="abrirModal('5.00', 'Caligrafia Tematica')">✨ Comprar Producto</button>
    </div>

    <div class="card">
      <h2 class="card-title">𖹭.ᐟ 𝚂𝚒𝚖𝚙𝚕𝚎</h2>
      <div class="item"><span>c/u</span><span class="price">S/3 / 100 💎</span></div>
      <button class="btn btn-comprar" onclick="abrirModal('3.00', 'Caligrafia Simple')">✨ Comprar Producto</button>
    </div>

    <a class="btn btn-wa" href="https://wa.me/message/2BUTTKQYZXH4K1">📲 Pedir por WhatsApp</a>

  </div>

  <!-- VENTANA FLOTANTE -->
  <div id="modalPago" class="modal">
    <div class="modal-content">
      <h3>Métodos De Pago 💜</h3>
      <p><b>Yape</b></p>
      <div class="modal-numero" id="numeroYape">932 712 628</div>
      <p style="font-size:3.5vw;">Eliseo B.</p>
      
      <button class="btn btn-copiar" onclick="copiarNumero()">📋 Copiar Número</button>
      <a class="btn btn-yape-modal" id="linkYape" href="#">Pagar con Yape</a>
      
      <p style="margin-top:15px;"><b>Diamantes 💎</b><br>
      id : 1434157249<br>
      Name : Baby Ann</p>
      
      <p class="cerrar" onclick="cerrarModal()">Cerrar</p>
    </div>
  </div>

<script>
  function abrirModal(monto, concepto) {
    document.getElementById('modalPago').style.display = 'flex';
    document.getElementById('linkYape').href = `https://www.yape.com.pe/qr/932712628?amount=${monto}&concept=${concepto}`;
  }
  
  function cerrarModal() {
    document.getElementById('modalPago').style.display = 'none';
  }
  
  function copiarNumero() {
    navigator.clipboard.writeText('932712628');
    alert('Número copiado: 932 712 628 💜');
  }
  
  window.onclick = function(event) {
    if (event.target == document.getElementById('modalPago')) {
      cerrarModal();
    }
  }
</script>

</body>
</html>
